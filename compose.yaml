services:
  postgres:
    image: 'postgres:17.2-alpine'
    environment:
      - 'POSTGRES_DB=clients-service'
      - 'POSTGRES_PASSWORD=clients-service'
      - 'POSTGRES_USER=clients-service'
    ports:
      - '5432:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U clients-service -d clients-service' ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
