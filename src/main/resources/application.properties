spring.application.name=clients-service
spring.docker.compose.skip.in-tests=false

# Flyway (classpath:db/migration) owns the schema; Hibernate only validates entities against it.
spring.jpa.hibernate.ddl-auto=validate

# Actuator: health (with DB liveness via the JPA/Datasource health indicator) drives the Dockerfile
# HEALTHCHECK; info/metrics exposed for local inspection. No auth exists yet, so component details stay
# hidden (show-details default is "never") rather than leaking DB connection info unauthenticated.
management.endpoints.web.exposure.include=health,info,metrics
