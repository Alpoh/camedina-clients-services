spring.application.name=clients-service
spring.docker.compose.skip.in-tests=false

# DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/DB_PASSWORD are injected by the ECS task definition
# (clients-infra's service-clients-service.yaml) - DB_USERNAME/DB_PASSWORD come from the
# RDS-managed Secrets Manager secret. Locally, compose.yaml's Postgres service must publish
# these same names or the defaults below (matching compose.yaml) apply.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clients-service}
spring.datasource.username=${DB_USERNAME:clients-service}
spring.datasource.password=${DB_PASSWORD:clients-service}

# Flyway (classpath:db/migration) owns the schema; Hibernate only validates entities against it.
spring.jpa.hibernate.ddl-auto=validate

# Actuator: health (with DB liveness via the JPA/Datasource health indicator) drives the Dockerfile
# HEALTHCHECK; info/metrics exposed for local inspection. No auth exists yet, so component details stay
# hidden (show-details default is "never") rather than leaking DB connection info unauthenticated.
management.endpoints.web.exposure.include=health,info,metrics

# Auth: self-issued JWTs (see co.medina.portfolio.clientsservice.auth). The default below is a dev-only
# placeholder, not a real secret — override via the SECURITY_JWT_SECRET env var in any real deployment.
security.jwt.secret=${SECURITY_JWT_SECRET:dev-only-jwt-signing-secret-change-me-before-any-real-deployment}
security.jwt.expiration=PT1H

# Swagger UI/OpenAPI docs require auth like every other endpoint by default (no dev/staging split
# existed when auth first landed). Overridden to true in application-local.properties only.
security.swagger.permit-all=false
